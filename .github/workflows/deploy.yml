name: Build & Deploy to Local K8s

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t python-frontend:latest .

      - name: Load image to local Docker
        run: docker image ls python-frontend

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout restart deployment/python-frontend

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to be ready..."
          kubectl rollout status deployment/python-frontend --timeout=2m
          echo "Deployment successful!"
          echo "Service endpoints:"
          kubectl get svc python-frontend
